name: Bug report
description: Report a reproducible product or automation defect.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
